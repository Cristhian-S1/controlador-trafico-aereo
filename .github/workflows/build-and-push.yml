name: Build and Push

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      tag:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: true
      context:
        required: false
        type: string
        default: ""
      dockerfile:
        required: false
        type: string
        default: ""

jobs:
  build-and-push:
    name: Build and Push ${{ inputs.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context != '' && inputs.context || format('./services/{0}', inputs.service) }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('./services/{0}/Dockerfile', inputs.service) }}
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/atc-${{ inputs.service }}:${{ inputs.tag }}
            ghcr.io/${{ steps.owner.outputs.owner }}/atc-${{ inputs.service }}:latest
