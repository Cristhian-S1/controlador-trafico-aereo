name: Deploy to QA

on:
  push:
    branches: [develop]

jobs:
  build:
    name: Build images
    strategy:
      matrix:
        include:
          - service: vuelos
          - service: pistas
          - service: tasas
          - service: gateway
            context: .
            dockerfile: ./nginx/Dockerfile
    uses: ./.github/workflows/build-and-push.yml
    with:
      service: ${{ matrix.service }}
      tag: qa-${{ github.sha }}
      push: true
      context: ${{ matrix.context || '' }}
      dockerfile: ${{ matrix.dockerfile || '' }}

