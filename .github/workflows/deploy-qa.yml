name: Deploy to QA

on:
  push:
    branches: [develop]

jobs:
  build:
    name: Build images
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: vuelos
          - service: pistas
          - service: tasas
          - service: gateway
            context: .
            dockerfile: ./nginx/Dockerfile
    uses: ./.github/workflows/build-and-push.yml
    with:
      service: ${{ matrix.service }}
      tag: qa-${{ github.sha }}
      push: true
      context: ${{ matrix.context || '' }}
      dockerfile: ${{ matrix.dockerfile || '' }}

  deploy:
    name: Deploy to QA
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_QA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Setup Kustomize
        run: |
          curl -sLO https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz
          tar xzf kustomize_v5.3.0_linux_amd64.tar.gz
          chmod +x kustomize
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Set image tags in QA overlay
        run: |
          cd k8s/overlays/qa
          kustomize edit set image \
            atc-vuelos=ghcr.io/cristhian-s1/atc-vuelos:qa-${{ github.sha }} \
            atc-pistas=ghcr.io/cristhian-s1/atc-pistas:qa-${{ github.sha }} \
            atc-tasas=ghcr.io/cristhian-s1/atc-tasas:qa-${{ github.sha }} \
            atc-gateway=ghcr.io/cristhian-s1/atc-gateway:qa-${{ github.sha }}

      - name: Deploy to QA
        run: |
          kustomize build k8s/overlays/qa | kubectl apply -f -
          kubectl -n grupo1-qa wait --for=condition=Available deployment/postgres-vuelos deployment/postgres-pistas deployment/postgres-tasas deployment/rabbitmq deployment/vuelos deployment/pistas deployment/tasas deployment/gateway --timeout=300s
