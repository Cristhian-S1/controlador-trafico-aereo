apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grupo1-qa

resources:
  - ../..
  - ingress.yaml

images:
  - name: atc-vuelos
    newName: ghcr.io/cristhian-s1/atc-vuelos
    newTag: qa-TAG
  - name: atc-pistas
    newName: ghcr.io/cristhian-s1/atc-pistas
    newTag: qa-TAG
  - name: atc-tasas
    newName: ghcr.io/cristhian-s1/atc-tasas
    newTag: qa-TAG
  - name: atc-gateway
    newName: ghcr.io/cristhian-s1/atc-gateway
    newTag: qa-TAG

replicas:
  - name: vuelos
    count: 2
  - name: pistas
    count: 2
  - name: tasas
    count: 2
  - name: gateway
    count: 2

patches:
  - path: image-pull-policy-patch.yaml
