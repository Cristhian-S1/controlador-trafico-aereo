apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: grupo1
  labels:
    grafana_dashboard: "1"
data:
  atc-dashboard.json: |
    {
      "title": "ATC - Controlador de Trafico Aereo",
      "tags": ["atc"],
      "timezone": "browser",
      "panels": [
        {
          "title": "Logs de Vuelos",
          "type": "logs",
          "gridPos": {"h": 12, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "{container=\"vuelos\"}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Logs de Pistas",
          "type": "logs",
          "gridPos": {"h": 12, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "{container=\"pistas\"}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Logs de Tasas",
          "type": "logs",
          "gridPos": {"h": 12, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "{container=\"tasas\"}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Todos los logs ATC",
          "type": "logs",
          "gridPos": {"h": 12, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "{namespace=~\"grupo1-qa|grupo1-prod\"}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 38
    }
