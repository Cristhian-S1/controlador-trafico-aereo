# Plantilla de Secretes para el namespace grupo1.
# En produccion no se versionan credenciales en texto plano.
# Aplicar con: kubectl apply -k k8s/
# Luego rotar valores reales con:
#   kubectl create secret generic atc-secrets \
#     --from-literal=POSTGRES_PASSWORD=<valor> \
#     --from-literal=RABBITMQ_DEFAULT_USER=<valor> \
#     --from-literal=RABBITMQ_DEFAULT_PASS=<valor> \
#     -n grupo1 --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: atc-secrets
  namespace: grupo1
type: Opaque
stringData:
  POSTGRES_PASSWORD: "atc123"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
  DATABASE_URL_VUELOS: "postgres://atc:atc123@postgres-vuelos:5432/vuelos"
  DATABASE_URL_PISTAS: "postgres://atc:atc123@postgres-pistas:5432/pistas"
  DATABASE_URL_TASAS: "postgres://atc:atc123@postgres-tasas:5432/tasas"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
