apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuelos
  namespace: grupo1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuelos
  template:
    metadata:
      labels:
        app: vuelos
    spec:
      containers:
        - name: vuelos
          image: atc-vuelos:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atc-secrets
                  key: DATABASE_URL_VUELOS
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: atc-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
