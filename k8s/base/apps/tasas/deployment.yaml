apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasas
  namespace: grupo1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasas
  template:
    metadata:
      labels:
        app: tasas
    spec:
      containers:
        - name: tasas
          image: atc-tasas:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atc-secrets
                  key: DATABASE_URL_TASAS
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: atc-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
